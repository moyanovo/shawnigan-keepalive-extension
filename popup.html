<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="Sam Huang">
    <title>Shawnigan Keepalive</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="panel" aria-busy="false">
      <p id="screenReaderStatus" class="sr-only" aria-live="polite" aria-atomic="true"></p>

      <section class="hero" data-tone="neutral">
        <div class="hero-copy">
          <p id="heroStatusBadge" class="status-pill">Loading</p>
          <h1>Session keeper</h1>
          <p id="heroSummary">Checking your Shawnigan pages</p>
        </div>
        <label class="switch">
          <span class="sr-only">Enable keepalive</span>
          <input id="enabled" type="checkbox" aria-label="Enable or disable keepalive">
          <span class="slider"></span>
        </label>
      </section>

      <section class="command-card" aria-label="Keepalive controls">
        <div class="command-heading">
          <span>Keep alive</span>
          <span id="intervalCustomHint" class="custom-hint" hidden></span>
        </div>
        <div id="intervalControl" class="segmented-control" role="group" aria-label="Keepalive interval">
          <button type="button" data-interval="smart">Smart</button>
          <button type="button" data-interval="5">5 min</button>
          <button type="button" data-interval="15">15 min</button>
          <button type="button" data-interval="30">30 min</button>
        </div>
        <button id="runNow" class="primary-action" type="button">Run now</button>
      </section>

      <section class="metrics" aria-label="Keepalive overview">
        <article class="metric">
          <span class="metric-label">Pages</span>
          <strong id="matchCount">0</strong>
        </article>
        <article class="metric">
          <span class="metric-label">Last run</span>
          <strong id="lastRun">Never</strong>
        </article>
        <article class="metric metric-result">
          <span class="metric-label">Result</span>
          <strong id="lastResult">Idle</strong>
        </article>
      </section>

      <p id="lastStats" class="activity-line">No checks yet</p>

      <details class="disclosure">
        <summary>Last details</summary>
        <ul id="detailsList" class="detail-list"></ul>
      </details>

      <details class="disclosure">
        <summary>Matched pages <span id="matchHint">0 pages</span></summary>
        <ul id="matchList" class="match-list"></ul>
      </details>

      <p class="footer-note">Shawnigan Keepalive · v1.4.0</p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
